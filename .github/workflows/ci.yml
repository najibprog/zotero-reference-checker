name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check content/refcheck.js && node --check bootstrap.js
      - name: Unit tests
        run: npm test
      - name: Build
        run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zotero-reference-checker-xpi
          path: zotero-reference-checker.xpi
